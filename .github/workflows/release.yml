name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for crate in ffr-core ffr-app xtask; do
            v=$(awk -v n="$crate" '$0=="name = \""n"\""{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
            if [ "$v" != "$version" ]; then echo "::error::Cargo.lock has $crate $v, expected $version"; exit 1; fi
          done
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then echo "::error::CHANGELOG.md has no section for $version"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  tests:
    needs: check
    if: needs.check.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo test --workspace --locked

  build:
    needs: [check, tests]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            asset: FastFileRecovery-setup.exe
          - os: ubuntu-22.04
            asset: fast-file-recovery-linux-x64
          - os: macos-15
            asset: fast-file-recovery-macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      FFR_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p ffr-app
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ needs.check.outputs.version }} "/DSourceExe=$PWD\target\release\fast-file-recovery.exe" installer\ffr.iss
          Copy-Item dist\FastFileRecovery-setup.exe .

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p ffr-app
          cp target/release/fast-file-recovery fast-file-recovery-linux-x64
          strip fast-file-recovery-linux-x64

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p ffr-app --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/fast-file-recovery fast-file-recovery-macos-arm64
          strip fast-file-recovery-macos-arm64
          codesign -s - --force fast-file-recovery-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and notes
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum FastFileRecovery-setup.exe fast-file-recovery-linux-x64 fast-file-recovery-macos-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          v="${{ needs.check.outputs.version }}"
          awk -v v="$v" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.check.outputs.version }}"
          flags=()
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v$v" \
            --target "${{ github.sha }}" \
            --title "Fast File Recovery v$v" \
            --notes-file notes.md \
            "${flags[@]}" \
            artifacts/FastFileRecovery-setup.exe \
            artifacts/fast-file-recovery-linux-x64 \
            artifacts/fast-file-recovery-macos-arm64 \
            artifacts/SHA256SUMS.txt
