[workspace]
resolver = "2"
members = ["crates/ffr-core", "crates/ffr-app", "crates/xtask"]
default-members = ["crates/ffr-core", "crates/ffr-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Akulav"]
repository = "https://github.com/Akulav/fast-file-recovery"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic = "abort" is deliberately NOT used: the engine relies on catch_unwind to release disk locks.

[profile.dev.package."*"]
opt-level = 2
